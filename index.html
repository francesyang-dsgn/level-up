<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Level Up Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#000;--maze:#1F6FE5;--pellet:#9CCBFF;--gold:#FFC72C;--white:#F4F7FF;--dim:#8C9AB8;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--white);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:380px;border:6px double var(--maze);border-radius:14px;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.logo{display:inline-flex;align-items:flex-start;gap:.08em;font-family:"Silkscreen","Courier New",monospace;font-weight:700;line-height:.9}
.lv{font-size:48px}
.upw{filter:drop-shadow(-3px 3px 0 var(--maze))}
.up{display:block;background:var(--pellet);color:#000;font-size:20px;padding:3px 7px 4px;clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
p{margin:0;line-height:1.5}
.status{font-family:"Silkscreen",monospace;color:var(--gold);letter-spacing:.08em}
.hint{font-size:13px;color:var(--dim)}
a.btn{display:block;width:100%;font-family:"Silkscreen",monospace;font-size:17px;letter-spacing:.12em;padding:14px 16px;border-radius:6px;background:var(--gold);color:#000;text-decoration:none;box-shadow:-5px 5px 0 var(--maze)}
code{font-size:12px;color:var(--pellet);word-break:break-all}
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="Level Up"><span class="lv">LEVEL</span><span class="upw"><span class="up">UP</span></span></div>
  <p class="status" id="status">LOADING THE GAME…</p>
  <a class="btn" id="go" href="https://claude.ai/artifact/WgTjMKSN9PTmf5TGuiG6Gj">TAP TO PLAY</a>
  <p class="hint">Opens in your browser. Sign in to Claude with your Betterment account if asked.</p>
  <p class="hint">Link not opening? Copy this into Safari or Chrome:<br><code>https://claude.ai/artifact/WgTjMKSN9PTmf5TGuiG6Gj</code></p>
</main>
<script>
(function(){
  var TARGET = "https://claude.ai/artifact/WgTjMKSN9PTmf5TGuiG6Gj";
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  // Android: an intent link aimed at Chrome skips the Claude app; falls back to the plain link if Chrome isn't installed.
  var ANDROID = "intent://claude.ai/artifact/WgTjMKSN9PTmf5TGuiG6Gj#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(TARGET) + ";end";
  // iPhone: x-safari-https opens the page in Safari instead of handing it to an app.
  var IOS = "x-safari-" + TARGET;
  var btn = document.getElementById("go");
  btn.href = isAndroid ? ANDROID : isIOS ? IOS : TARGET;
  // Automatic forward. On iPhone a script redirect (no tap) normally stays in Safari.
  setTimeout(function(){
    if (isAndroid) location.href = ANDROID;
    else location.replace(TARGET);
  }, 300);
  setTimeout(function(){ document.getElementById("status").textContent = "READY TO PLAY"; }, 2500);
})();
</script>
</body>
</html>
